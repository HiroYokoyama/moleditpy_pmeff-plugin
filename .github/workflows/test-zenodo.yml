name: Test Zenodo Sandbox Upload

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload (e.g. v2.2.0). If left empty, the latest release will be used."
        required: false
        type: string
      deposition_id:
        description: "Zenodo Sandbox record ID to update (required: the production default does not exist on sandbox)."
        required: true
        type: string
      draft:
        description: "Keep as a draft (do not publish)."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test-zenodo-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist

          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "No tag specified, fetching latest release tag..."
            TAG=$(gh release view --json tagName --template '{{.tagName}}')
          fi
          echo "Processing tag: $TAG"
          echo "TAG=$TAG" >> $GITHUB_ENV

          gh release download "$TAG" --pattern "*.zip" --dir dist --skip-existing || true

          curl -L -o "dist/source.tar.gz" "https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"

          echo "Downloaded assets:"
          ls -la dist/

      - name: Upload to Zenodo Sandbox
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_SANDBOX_TOKEN }}
        run: |
          PUBLISH_ARG="--publish"
          if [ "${{ github.event.inputs.draft }}" = "true" ]; then
            PUBLISH_ARG=""
          fi

          python scripts/update_zenodo.py             --sandbox             $PUBLISH_ARG             --deposition-id "${{ github.event.inputs.deposition_id }}"             --version-string "$TAG"             dist/*
