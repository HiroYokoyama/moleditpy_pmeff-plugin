name: Release

# Two artifacts from one version tag:
#   1. the MoleditPy plugin zip (attached to a GitHub Release, registry
#      notified) — mirrors the other moleditpy plugin repos, and
#   2. the standalone `pmeff` distribution published to PyPI.
#
# Trigger by pushing a `vX.Y.Z` tag, or run the workflow manually ("one click"
# from the Actions tab) with the version as input — the workflow then creates
# and pushes the tag for you.

on:
  workflow_dispatch:
    inputs:
      zenodo:
        description: 'Upload and publish to Zenodo after the release'
        required: false
        type: boolean
        default: true
      version:
        description: 'Release version (e.g. 1.0.0 — without leading v)'
        required: true
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Plugin zip + GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Verify version matches plugin source
        run: python scripts/release_common.py verify --version "$VERSION"

      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Build plugin zip
        run: python scripts/release_common.py package --version "$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_common.py publish --version "$VERSION"

      - name: Trigger moleditpy-plugins registry update
        if: success()
        continue-on-error: true
        env:
          REGISTRY_PAT: ${{ secrets.REGISTRY_PAT }}
        run: python scripts/release_common.py notify --version "$VERSION"

  pypi:
    name: Publish pmeff to PyPI
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pmeff
    permissions:
      # Trusted publishing (OIDC): no API token/secret needed. Configure a
      # PyPI "pending publisher" for project `pmeff` pointing at this repo,
      # workflow `release.yml`, environment `pypi` before the first release.
      id-token: write
      # Needed to attach the built sdist/wheel to the GitHub Release.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Sync the force field engine into the pmeff package
        run: python scripts/sync_forcefield.py

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Verify the built version matches the tag
        run: |
          ls dist/
          test -f "dist/pmeff-${VERSION}.tar.gz" || {
            echo "ERROR: expected dist/pmeff-${VERSION}.tar.gz not found"; exit 1;
          }

      - name: Attach sdist and wheel to the GitHub Release
        # Done before publishing so the binaries reach the release even if the
        # PyPI upload step fails (e.g. trusted publisher not yet configured).
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${VERSION}" dist/*.whl dist/*.tar.gz --clobber

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Generate PEP 740 digital attestations (the default under Trusted
          # Publishing). They are written next to the distributions in dist/
          # as <distribution>.publish.attestation and uploaded to PyPI.
          attestations: true

      - name: Attach PEP 740 attestations to the GitHub Release
        # The .publish.attestation files the publish step produced in dist/ are
        # the signed provenance for each wheel/sdist; attach them to the Release
        # so they travel with the GitHub artifacts too, not only PyPI.
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          attestations=(dist/*.publish.attestation)
          if [ ${#attestations[@]} -eq 0 ]; then
            echo "No .publish.attestation files were produced; skipping."
            exit 0
          fi
          gh release upload "v${VERSION}" "${attestations[@]}" --clobber

  sync-back:
    name: Commit synced package files back to main
    # Runs after a successful publish so the committed copy of the derived
    # package (pmeff/forcefield.py + pmeff/_version.py) always matches what was
    # just released — e.g. if the tag was cut without running the sync script
    # locally first. If they are already in sync (the normal case) this no-ops.
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Re-sync the pmeff package from the plugin source
        run: python scripts/sync_forcefield.py

      - name: Commit and push if anything changed
        run: |
          if git diff --quiet -- pmeff/forcefield.py pmeff/_version.py; then
            echo "pmeff package already in sync with the release — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pmeff/forcefield.py pmeff/_version.py
          git commit -m "chore: sync pmeff package to ${GITHUB_REF_NAME} [skip ci]"
          git push origin HEAD:main

  # Archiving runs here rather than from zenodo.yml's `release: published`
  # trigger: this workflow mints the release with GITHUB_TOKEN, and GitHub does
  # not raise workflow-triggering events for token-authored actions, so that
  # trigger never fires. Same shape as the main app's release.yml.
  zenodo-upload:
    # A tag push always archives; a manual dispatch can opt out.
    if: ${{ github.event_name == 'push' || inputs.zenodo }}
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${{ github.event.inputs.version }}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Archiving tag: $TAG"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name | select(endswith(".zip"))')
          while IFS= read -r asset; do
            [ -z "$asset" ] || gh release download "$TAG" --pattern "$asset" --dir dist --skip-existing
          done <<< "$ASSETS"
          curl --fail --location --retry 3 -o "dist/source.tar.gz" \
            "https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"
          ls -la dist/

      - name: Upload and Publish to Zenodo
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          if [ -z "$ZENODO_TOKEN" ]; then
            echo "ERROR: ZENODO_TOKEN is not set, so $TAG was released but not archived." >&2
            exit 1
          fi
          # --deposition-id is omitted on purpose: DEPOSITION_ID in the script
          # is the single source of truth for which record family to version.
          python scripts/update_zenodo.py \
            --publish \
            --version-string "$TAG" \
            dist/*
